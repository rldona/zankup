[project]
name = "opensport"
version = "0.1.0"
description = "OpenSport backend: API, Garmin sync and computation engine"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "opensport-metrics",
  "pydantic-settings>=2.8",
  "sqlalchemy>=2.0",
  "alembic>=1.15",
  "psycopg[binary]>=3.2",
  "httpx>=0.28",
]

[tool.uv.sources]
opensport-metrics = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opensport"]
