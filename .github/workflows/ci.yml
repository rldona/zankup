name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (supply chain); the comment shows the release.
jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: zankup
          POSTGRES_PASSWORD: zankup
          POSTGRES_DB: zankup
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zankup" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://zankup:zankup@127.0.0.1:5432/zankup
      REQUIRE_DB: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: PostgreSQL 18 client (pg_dump and pg_restore for the backup tests)
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: uv run ruff check --output-format=github
      - name: Format
        run: uv run ruff format --check
      - name: Type check
        run: uv run mypy
      - name: Migrations apply and match the models
        run: |
          uv run alembic -c backend/alembic.ini upgrade head
          uv run alembic -c backend/alembic.ini check
      - name: Test
        run: uv run pytest -W error
      - name: Fixtures contain no personal data
        run: uv run python tools/check_fixtures.py
      - name: OpenAPI document is up to date
        run: |
          uv run python -m zankup.api.openapi_export
          git diff --exit-code -- packages/core/src/api/openapi.json || {
            echo "::error::Run 'pnpm generate:api' and commit packages/core/src/api/"; exit 1; }
      - name: Docker build
        run: docker build -f backend/Dockerfile -t zankup-api:ci .

  web:
    name: Web (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Enable pnpm (version from package.json)
        run: corepack enable pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: API types are up to date
        run: |
          pnpm --filter @zankup/core generate:types
          git diff --exit-code -- packages/core/src/api/schema.ts || {
            echo "::error::Run 'pnpm generate:api' and commit packages/core/src/api/"; exit 1; }
      - name: Format
        run: pnpm format:check
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: End-to-end tests (main flows in English and Spanish, accessibility)
        run: |
          pnpm --filter @zankup/web exec playwright install --with-deps chromium
          pnpm --filter @zankup/web e2e
