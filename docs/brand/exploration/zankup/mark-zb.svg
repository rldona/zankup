<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" role="img" aria-label="Zankup">
  <!-- ZB: same peaks, the Z walked bottom-up and ending in an arrowhead. Original design. -->
  <defs>
    <mask id="trail">
      <rect width="120" height="90" fill="#fff"/>
      <path d="M78 79 L48 79 L76 61 L58 61" fill="none" stroke="#000" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
      <polygon points="45,61 55,54 55,68" fill="#000" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g mask="url(#trail)" fill="#000" stroke="#000" stroke-width="9" stroke-linejoin="round">
    <polygon points="17,80 34.2,49 51.4,80"/>
    <polygon points="68.6,80 85.8,49 103,80"/>
    <polygon points="30.8,80 60,15 89.2,80"/>
  </g>
</svg>
