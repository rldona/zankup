name: Android

# The app's release build (OS-502): only when the app, the shared package or the lockfile change.
# Lint, types and unit tests run in CI's web job with the rest of the workspace.
on:
  pull_request:
    paths: ['apps/mobile/**', 'packages/core/**', 'pnpm-lock.yaml', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'packages/core/**', 'pnpm-lock.yaml', '.github/workflows/android.yml']

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android release build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable pnpm (version from package.json)
        run: corepack enable pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate the native project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild -p android --no-install
        env:
          CI: '1'
      - name: Build the release APK (arm64)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
