<!doctype html><html lang="es"><meta charset="utf-8"><title>Z suelta</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Boldonse&family=Momo+Trust+Display&display=swap">
<style>
body{margin:0;font:14px system-ui;background:#f4f5f3;color:#111;padding:20px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.opt{background:#fff;border-radius:16px;padding:14px;display:grid;gap:10px;justify-items:center}
.opt h2{margin:0;font-size:13px}
.big{height:128px;display:grid;place-items:center;font-size:120px;line-height:1}
.big svg{width:170px;height:128px;color:#111}
.pair{display:flex;gap:8px}.ico{width:60px;height:60px;border-radius:15px;display:grid;place-items:center;font-size:40px;line-height:1}.ico svg{width:40px;height:40px}
.dark{background:#111;color:#fff}.light{background:#fff;color:#111;border:3px solid #111}.green{background:#0b8f6a;color:#fff}
.tiny{display:flex;gap:12px;align-items:center}.tiny span{line-height:1}.tiny svg{height:16px;width:16px}.tiny .s24 svg{height:24px;width:24px}.tiny .s32 svg{height:32px;width:32px}
.m{font-family:"Momo Trust Display"}.b{font-family:Boldonse}
.word{display:flex;align-items:center;gap:10px;font-size:28px}.word svg{width:40px;height:30px}
</style>
<svg width="0" height="0" style="position:absolute"><defs><symbol id="z4" viewBox="0 0 120 90"><path d="M100 76 H24 L96 28 H44" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><polygon points="20,28 40,14 40,42" fill="currentColor" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/></symbol></defs></svg>

    <div class="tiny m"><span style="font-size:16px">Z</span><span style="font-size:24px">Z</span><span style="font-size:32px">Z</span></div></div>
  <div class="opt"><h2>Z de Boldonse, tal cual</h2><div class="big b">Z</div>
    <div class="pair"><div class="ico dark b">Z</div><div class="ico light b">Z</div><div class="ico green b">Z</div></div>
