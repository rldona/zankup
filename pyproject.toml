# uv workspace root for the Python projects: backend/ (AGPL-3.0) and packages/metrics/ (MIT).
[project]
name = "zankup-workspace"
version = "0.0.0"
requires-python = ">=3.12"
# The workspace members, so a plain `uv sync` installs both into the shared .venv.
dependencies = ["zankup", "zankup-metrics"]

[dependency-groups]
dev = [
  "boto3-stubs[s3]>=1.38",
  "httpx2>=0.1",
  "respx>=0.22",
  "mypy>=1.15",
  "pre-commit>=4.2",
  "pytest>=8.3",
  "ruff>=0.11",
]

[tool.uv]
package = false
# Supply-chain guard: only resolve releases at least two weeks old. Move the date forward when upgrading.
exclude-newer = "2026-10-25T00:00:00Z"

[tool.uv.workspace]
members = ["backend", "packages/metrics"]

[tool.uv.sources]
zankup = { workspace = true }
zankup-metrics = { workspace = true }

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["docs", "tools/build_proto_data.py", "apps", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["zankup", "zankup_metrics", "anonymise_fit", "anonymise_track", "check_fixtures", "scrub_garmin_list"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/src", "packages/metrics/src", "tools/anonymise_fit.py", "tools/anonymise_track.py", "tools/check_fixtures.py", "tools/scrub_garmin_list.py", "tools/usb_import.py", "backend/garmin_sync.py"]
mypy_path = "tools"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fitdecode", "fitdecode.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests", "packages/metrics/tests", "tools/tests"]
pythonpath = ["tools"]
addopts = "-q --import-mode=importlib"
