[project]
name = "opensport-metrics"
version = "0.1.0"
description = "Open, documented training metrics for activity data: zones, load, fitness, curves and estimates"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opensport_metrics"]
