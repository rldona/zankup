<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b8f6a">
<title>OpenSport</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data.js"></script>
<style>
/* ---------- temas: tokens de diseño ---------- */
/* fijos (no dependen del tema) */
:root{
  --z1:#a5d8ff;--z2:#69db7c;--z3:#ffd43b;--z4:#ff922b;--z5:#f03e3e;
  --ctl:#1c7ed6;--atl:#e64980;--tsbp:#40c057;--tsbn:#fa5252;--other:#868e96;--row:#0c8599;--swim:#15aabf;
}
/* Claro (por defecto) */
:root,[data-theme="light"]{color-scheme:light;
  --bg:#f4f5f3;--surface:#fff;--surface2:#f8f8f6;--fg:#17191a;--muted:#676b6e;--line:#e3e4e0;
  --accent:#0b8f6a;--accent-fg:#fff;--accent-soft:#e2f4ee;
  --run:#e8590c;--ride:#1c7ed6;--strength:#7048e8;--walk:#2b8a3e;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);--radius:14px}
/* Oscuro */
@media (prefers-color-scheme:dark){:root:not([data-theme]){color-scheme:dark;
  --bg:#0f1112;--surface:#181b1d;--surface2:#1e2124;--fg:#eceeed;--muted:#9aa0a3;--line:#2a2e31;
  --accent:#20c997;--accent-fg:#06221a;--accent-soft:#13302a;--shadow:none;
  --run:#ff8a3d;--ride:#4dabf7;--strength:#9775fa;--walk:#51cf66}}
[data-theme="dark"]{color-scheme:dark;
  --bg:#0f1112;--surface:#181b1d;--surface2:#1e2124;--fg:#eceeed;--muted:#9aa0a3;--line:#2a2e31;
  --accent:#20c997;--accent-fg:#06221a;--accent-soft:#13302a;--shadow:none;
  --run:#ff8a3d;--ride:#4dabf7;--strength:#9775fa;--walk:#51cf66}
/* Negro OLED: negro puro, ahorra batería en pantallas OLED */
[data-theme="oled"]{color-scheme:dark;
  --bg:#000;--surface:#0b0b0b;--surface2:#141414;--fg:#f2f2f2;--muted:#8f8f8f;--line:#1f1f1f;
  --accent:#38d9a9;--accent-fg:#001a12;--accent-soft:#0d2a21;--shadow:none;
  --run:#ff922b;--ride:#4dabf7;--strength:#9775fa;--walk:#69db7c}
/* Alto contraste: bordes y texto al máximo, sin sombras */
[data-theme="contraste"]{color-scheme:light;
  --bg:#fff;--surface:#fff;--surface2:#eeeeee;--fg:#000;--muted:#262626;--line:#000;
  --accent:#0033cc;--accent-fg:#fff;--accent-soft:#d6e0ff;--shadow:none;
  --run:#b33c00;--ride:#0050b3;--strength:#5a2fc2;--walk:#1d6b2f}
/* Bosque: oscuro verdoso */
[data-theme="bosque"]{color-scheme:dark;
  --bg:#0d1611;--surface:#132019;--surface2:#1a2a21;--fg:#e4efe7;--muted:#98ae9f;--line:#24372c;
  --accent:#8ce99a;--accent-fg:#0a1a0f;--accent-soft:#1d3a26;--shadow:none;
  --run:#ffa94d;--ride:#74c0fc;--strength:#b197fc;--walk:#8ce99a}
/* Océano: claro azulado */
[data-theme="oceano"]{color-scheme:light;
  --bg:#edf3f9;--surface:#fff;--surface2:#f2f7fc;--fg:#0e2233;--muted:#57708a;--line:#d3e1ee;
  --accent:#1971c2;--accent-fg:#fff;--accent-soft:#dbeafa;
  --run:#e8590c;--ride:#1864ab;--strength:#6741d9;--walk:#2b8a3e;
  --shadow:0 1px 2px rgba(14,34,51,.06),0 6px 18px rgba(14,34,51,.05)}
/* Atardecer: claro cálido */
[data-theme="atardecer"]{color-scheme:light;
  --bg:#fbf3ec;--surface:#fffaf5;--surface2:#f8ebe0;--fg:#2b1c12;--muted:#7f6656;--line:#efd9c8;
  --accent:#d9480f;--accent-fg:#fff;--accent-soft:#ffe6d5;
  --run:#c2410c;--ride:#1c7ed6;--strength:#7048e8;--walk:#2b8a3e;
  --shadow:0 1px 2px rgba(60,30,10,.06),0 6px 18px rgba(60,30,10,.05)}
/* en temas oscuros, el mapa raster se oscurece para no deslumbrar */
.is-dark .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.7)}
[data-theme="contraste"] .card,[data-theme="contraste"] .panel,[data-theme="contraste"] .kpi{border-width:2px}
*{box-sizing:border-box}
html,body{height:100%}
/* barras de desplazamiento finas y con los colores del tema */
:root{--sb-thumb:color-mix(in srgb,var(--fg) 22%,transparent);--sb-thumb-hover:color-mix(in srgb,var(--fg) 40%,transparent)}
*{scrollbar-width:thin;scrollbar-color:var(--sb-thumb) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--sb-thumb);border-radius:10px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--sb-thumb-hover);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:232px 1fr;height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;gap:4px}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:18px;padding:4px 10px 18px;letter-spacing:-.2px}
.brand b{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:15px}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:0;background:none;text-align:left;width:100%;color:var(--muted);font-weight:550}
.nav:hover{background:var(--surface2);color:var(--fg)}
.nav.on{background:var(--accent-soft);color:var(--accent)}
.side .grow{flex:1}
.syncbtn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px;background:var(--accent);color:var(--accent-fg);font-weight:650}
.lastsync{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.main{overflow:hidden;display:flex;min-width:0}
.view{flex:1;overflow:auto;min-width:0}
.topbar,.tabbar{display:none}

/* feed + detail */
.feedwrap{display:grid;grid-template-columns:400px 1fr;height:100%;min-width:0}
.feedcol{border-right:1px solid var(--line);overflow:auto;background:var(--bg)}
.detailcol{overflow:auto;min-width:0}
.pad{padding:20px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.3px}
h2{font-size:16px;margin:0 0 12px}
.week{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.week .row{display:flex;gap:18px;margin-top:6px}
.week .row div b{display:block;font-size:18px}
.week .row div span{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;white-space:nowrap;font-size:13px}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;display:block;width:100%;text-align:left;box-shadow:var(--shadow)}
.card:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.chead{display:flex;gap:10px;align-items:center}
.sp{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.ctitle{font-weight:650;font-size:15px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.csub{font-size:12px;color:var(--muted)}
.cbody{display:flex;gap:12px;align-items:flex-end;margin-top:10px}
.cstats{display:grid;grid-template-columns:repeat(3,auto);gap:4px 18px;flex:1}
.cstats b{display:block;font-size:16px}
.cstats span{font-size:11px;color:var(--muted)}
.thumb{width:88px;height:64px;flex:none;border-radius:8px;background:var(--surface2)}
.badges{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.badge{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.badge.pr{background:#fff3bf;color:#7a5b00;border-color:#ffe066}

/* detail */
.dhead{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.back{display:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:19px;letter-spacing:-.2px}
.kpi span{font-size:11.5px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow)}
.panel .ph{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel .ph h2{margin:0;flex:1}
.panel .pb{padding:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:4px 10px;font-size:12.5px}
.seg button.on{background:var(--fg);color:var(--bg)}
.map{height:380px;background:var(--surface2)}
.legend{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.legend i{width:80px;height:7px;border-radius:4px;display:inline-block}
.chart{position:relative}
.chart svg{display:block;width:100%;height:170px}
.readout{font-size:12px;color:var(--muted);padding:6px 14px 10px;min-height:28px}
.zones .bar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin-bottom:10px}
.cstats b{white-space:nowrap}
.zrow{display:grid;grid-template-columns:30px 1fr 92px 48px;gap:8px;align-items:center;font-size:12.5px;margin:5px 0}
.zrow .track{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.zrow .track i{display:block;height:100%}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-weight:550;color:var(--muted);font-size:12px}
tr:last-child td{border-bottom:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.effort{display:flex;align-items:center;gap:14px}
.ring{width:74px;height:74px;flex:none}
.note{font-size:12px;color:var(--muted)}

/* stats */
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.vbars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:6px}
.vbars .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.vbars .stack{width:100%;max-width:26px;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden}
.vbars .lbl{font-size:10px;color:var(--muted);white-space:nowrap}
.flegend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.flegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tsbnow{display:flex;gap:18px;margin-bottom:10px;flex-wrap:wrap}
.tsbnow div b{font-size:22px;display:block}
.tsbnow div span{font-size:12px;color:var(--muted)}

/* settings */
.form{display:grid;gap:12px;max-width:640px}
.pad.narrow{max-width:720px;margin:0 auto}
.pad.narrow .form{max-width:none}
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.field input[type=number]{width:80px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--fg);font:inherit;text-align:right}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.theme{display:flex;flex-direction:column;gap:6px;text-align:left;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.theme[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.theme .tname{font-weight:600;font-size:13px}
.theme .note{margin-top:-4px}
.tprev{position:relative;display:block;height:68px;border-radius:8px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.tprev:not([data-theme]){background:linear-gradient(135deg,#f4f5f3 50%,#0f1112 50%)}
.tprev .tbar{position:absolute;left:0;top:0;bottom:0;width:22%;background:var(--surface);border-right:1px solid var(--line)}
.tprev .tcard{position:absolute;left:30%;right:8%;top:12px;height:40px;border-radius:6px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:5px;padding:7px}
.tprev .tcard b{display:block;height:5px;border-radius:3px;background:var(--fg);opacity:.75;width:70%}
.tprev .tcard b+b{background:var(--muted);width:45%;opacity:.6}
.tprev .tdot{position:absolute;right:12%;bottom:20px;width:14px;height:14px;border-radius:50%;background:var(--accent)}
.tprev:not([data-theme]) .tbar,.tprev:not([data-theme]) .tcard,.tprev:not([data-theme]) .tdot{display:none}
.switch{width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;border:0}
.switch.on{background:var(--accent)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on::after{left:21px}

/* sync sheet + toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:50}
.scrim.open{display:flex}
.sheet{background:var(--surface);border-radius:18px;padding:22px;width:min(440px,calc(100% - 32px));box-shadow:0 20px 60px rgba(0,0,0,.25)}
.steps{list-style:none;padding:0;margin:14px 0}
.steps li{display:flex;gap:10px;align-items:center;padding:6px 0;color:var(--muted)}
.steps li.done{color:var(--fg)}
.steps li .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:11px}
.steps li.done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.steps li.run .dot{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.btnrow{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.toast{position:fixed;right:20px;top:20px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 40px rgba(0,0,0,.18);transform:translateY(-140%);transition:transform .35s;z-index:60;max-width:360px}
.toast.show{transform:none}
.proto{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);font-size:11px;white-space:nowrap;background:var(--fg);color:var(--bg);padding:3px 10px;border-radius:999px;opacity:.65;pointer-events:none;z-index:5}
.empty{display:grid;place-items:center;height:100%;color:var(--muted)}

/* ---------- cabecera «Tu semana» ---------- */
:root{--st-fresco:#4dabf7;--st-neutro:#adb5bd;--st-productivo:#40c057;--st-sobrecarga:#fa5252}
.wk{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.wkhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.wkhead h2{margin:0;flex:1;font-size:16px}
.streak{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--accent);font-size:13px;background:var(--accent-soft);padding:4px 10px;border-radius:999px}
.streak svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linejoin:round}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.days .dl{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.day{width:38px;height:38px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--surface2);color:var(--muted);border:2px solid transparent;position:relative}
.day.act{color:#fff;border:0;cursor:pointer}
.day.act svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.day.act .n{position:absolute;right:-3px;top:-3px;background:var(--fg);color:var(--bg);font-size:10px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center}
.day.today{border-color:var(--fg);background:transparent;color:var(--fg)}
.day.future{background:transparent;border:2px dashed var(--line)}
.wkstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.wkstats b{display:block;font-size:16px}
.wkstats span{font-size:11px;color:var(--muted)}
.hl{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:10px;overflow-x:auto;margin:0 -20px 4px;padding:2px 20px 10px;scroll-snap-type:x mandatory}
.hcard{scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-height:132px}
.hcard .k{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.hcard .k i{width:8px;height:8px;border-radius:50%}
.hcard .v{font-size:22px;font-weight:750;letter-spacing:-.3px;line-height:1.15}
.hcard .s{font-size:12px;color:var(--muted)}
.hcard .grow{flex:1}
.st28{display:flex;gap:2px;height:8px;margin-top:6px}
.st28 i{flex:1;border-radius:2px}
.st28+.s{display:flex;justify-content:space-between;margin-top:4px}
.minibar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;margin-top:6px;position:relative}
.minibar i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.minibar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.5}
.more{width:100%;margin:6px 0 24px}

/* ---------- acceso ---------- */
body.auth .side,body.auth .topbar,body.auth .tabbar,body.auth .proto{display:none!important}
body.auth .app{grid-template-columns:1fr;grid-template-rows:1fr}
.login{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr;background:var(--bg)}
.lart{position:relative;overflow:hidden;background:var(--accent);color:var(--accent-fg);padding:44px;display:flex;flex-direction:column;justify-content:space-between}
.lart svg.routes{position:absolute;inset:0;width:100%;height:100%;opacity:.28}
.lart .brand{padding:0;color:inherit;font-size:22px;position:relative}
.lart .brand b{background:var(--accent-fg);color:var(--accent)}
.lart h2{font-size:30px;line-height:1.15;margin:0 0 10px;max-width:420px;position:relative;letter-spacing:-.5px}
.lart p{margin:0;max-width:400px;opacity:.85;position:relative}
.lart .lstats{display:flex;gap:26px;margin-top:22px;position:relative}
.lart .lstats b{display:block;font-size:22px}
.lart .lstats span{font-size:12px;opacity:.8}
.lform{display:grid;place-items:center;padding:32px 20px}
.lcard{width:100%;max-width:380px}
.lcard h1{font-size:24px;margin:0 0 4px}
.lcard .sub{color:var(--muted);margin-bottom:22px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;font-size:13px;font-weight:600}
.fld input{font:inherit;font-size:15px;font-weight:400;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
.fld input:focus,.otp input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.pw{position:relative}
.pw input{width:100%;padding-right:44px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);padding:6px}
.lrow{display:flex;justify-content:space-between;align-items:center;margin:4px 0 18px;font-size:13px}
.lrow label{display:flex;gap:8px;align-items:center;color:var(--muted);cursor:pointer}
.lrow a{color:var(--accent);text-decoration:none;font-weight:600}
.btn.block{width:100%;padding:12px;font-size:15px;display:flex;justify-content:center;align-items:center;gap:8px}
.gbtn{background:#fff;color:#1f1f1f;border:1px solid #dadce0;font-weight:600}
.is-dark .gbtn{background:#131314;color:#e3e3e3;border-color:#8e918f}
.alt{display:grid;gap:10px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:16px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.lerr{background:color-mix(in srgb,var(--st-sobrecarga) 12%,transparent);color:var(--st-sobrecarga);border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:14px;display:none}
.lerr.show{display:block}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:6px 0 18px}
.otp input{font:inherit;font-size:22px;font-weight:700;text-align:center;padding:12px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);width:100%}
.lfoot{margin-top:26px;font-size:12px;color:var(--muted);text-align:center}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@media (max-width:1023px){
  .login{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .lart{padding:22px 20px 26px}
  .lart h2{font-size:22px;margin-top:18px}
  .lart .lstats,.lart p{display:none}
  .lform{align-items:start;padding:26px 20px}
}

/* ---------- ondas, registro y recuperación ---------- */
.lart canvas.waves{position:absolute;inset:0;width:100%;height:100%}
.steps-dots{display:flex;gap:6px;margin-bottom:18px}
.steps-dots i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps-dots i.on{background:var(--accent)}
.meter{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin:-6px 0 4px}
.meter i{display:block;height:100%;width:0;transition:width .2s,background .2s}
.hint{font-size:12px;color:var(--muted);margin-bottom:12px}
.qrbox{display:flex;gap:16px;align-items:center;margin:4px 0 16px;flex-wrap:wrap}
.qrbox svg{width:128px;height:128px;background:#fff;padding:8px;border-radius:10px;border:1px solid var(--line);flex:none}
.secret{font:600 14px ui-monospace,Menlo,monospace;letter-spacing:1px;background:var(--surface2);padding:8px 10px;border-radius:8px;word-break:break-all}
.codes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 12px}
.codes code{font-size:14px;text-align:center;padding:8px 0;background:var(--surface2);border-radius:8px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:6px 0 16px;cursor:pointer}
.done-ico{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:28px;margin-bottom:12px}
.nexts{display:grid;gap:8px;margin:12px 0 18px}
.nexts div{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px}
.lswitch{text-align:center;font-size:13px;margin-top:16px;color:var(--muted)}
.lswitch a{color:var(--accent);font-weight:600;text-decoration:none}

/* ---------- búsqueda ---------- */
.searchwrap{display:grid;grid-template-columns:300px 1fr;height:100%;min-width:0}
.fpanel{border-right:1px solid var(--line);overflow:auto;padding:20px}
.fpanel h3{font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.fpanel h3:first-of-type{margin-top:4px}
.fpanel .chips{flex-wrap:wrap;overflow:visible}
.range{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.range input,.fpanel select,.fpanel input[type=date]{font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--fg);width:100%;min-width:0}
.fpanel label.ck{display:flex;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.rescol{overflow:auto;min-width:0}
.sbar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.sbar input{flex:1;font:inherit;font-size:15px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);min-width:0}
.sbar select{font:inherit;font-size:13px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg)}
.active-f{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.active-f button{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.rtable{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rtable th{position:sticky;top:0;background:var(--surface2);z-index:1}
.rtable tbody tr{cursor:pointer}
.rtable tbody tr:hover{background:var(--surface2)}
.rtable td.nm{max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.rtable td.nm .sp{display:inline-grid;vertical-align:middle;margin-right:8px;border-radius:7px}
.ftoggle{display:none}
.fclose{display:none!important}

/* ---------- filtro de periodo ---------- */
.period{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.period select,.period input{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
.period input{flex:1;min-width:140px}
.period .clear{border:0;background:none;color:var(--accent);font-size:13px;font-weight:600;padding:4px}
.psum{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-bottom:14px}
.psum div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.psum b{display:block;font-size:17px}
.psum span{font-size:11.5px;color:var(--muted)}
.psum .delta{font-size:11.5px;font-weight:600}
.up{color:var(--st-productivo)} .down{color:var(--st-sobrecarga)}
.mhead{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 8px;font-size:13px}
.mhead b{font-size:14px;text-transform:capitalize}
.mhead span{color:var(--muted)}
.prog{position:relative}
.prog svg{display:block;width:100%;height:260px}
.prog .tip{font-size:12px;color:var(--muted);min-height:20px;margin-top:6px}
.prog .tip b{color:var(--fg)}
.vbars.many .lbl.num{display:none}

/* ---------- perfil ---------- */
.phead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.avatar{width:84px;height:84px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:30px;font-weight:750;flex:none}
.phead .who{flex:1;min-width:200px}
.phead h1{margin:0}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.pstats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pstats b{display:block;font-size:20px}
.pstats span{font-size:11.5px;color:var(--muted)}
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.ptabs button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.ptabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.goal{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0}
.goal .ring{width:62px;height:62px}
.goal b{display:block}
.est{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.est:last-child{border-bottom:0}
.est .val{font-size:18px;font-weight:700;text-align:right}
.est .how{grid-column:1/-1;font-size:12px;color:var(--muted)}
.est a{color:var(--accent)}
.src{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.src:last-child{border-bottom:0}
.src .logo{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:13px;flex:none}
.src .grow{flex:1}
.ok{color:var(--accent);font-weight:600;font-size:13px}
.emptybox{text-align:center;padding:18px 10px;color:var(--muted)}
.emptybox svg{width:40px;height:40px;stroke:var(--muted);fill:none;stroke-width:1.6;margin-bottom:6px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.formgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.formgrid input,.formgrid select{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--fg)}
.formgrid .full{grid-column:1/-1}

/* ---------- mobile ---------- */
@media (max-width:1023px){
  /* en móvil el sistema usa barras superpuestas: aquí las ocultamos para que el prototipo se vea igual */
  *{scrollbar-width:none}
  ::-webkit-scrollbar{display:none}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;height:100dvh}
  .side{display:none}
  .topbar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .topbar .brand{padding:0;font-size:17px;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .topbar .brand b{display:inline-grid;vertical-align:middle;margin-right:8px}
  .topbar .grow{flex:1}
  .iconbtn{border:0;background:var(--surface2);width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px}
  .tab.on{color:var(--accent)}
  .feedwrap{grid-template-columns:1fr}
  .feedcol{border-right:0}
  .detailcol{display:none}
  .feedwrap.detail .feedcol{display:none}
  .feedwrap.detail .detailcol{display:block}
  .pad{padding:14px 16px}
  .back{display:grid}
  .map{height:280px}
  .grid2{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(3,1fr)}
  .kpi b{font-size:17px}
  .statgrid{grid-template-columns:1fr}
  .searchwrap{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .fpanel{display:none;border-right:0}
  .fpanel.open{display:block;position:fixed;left:0;right:0;bottom:0;max-height:80vh;z-index:45;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);padding-bottom:0}
  .fclose{display:flex!important;position:sticky;bottom:0;margin:16px -20px 0;border-radius:0;padding:14px}
  .ftoggle{display:inline-flex}
  .sbar{flex-wrap:wrap}
  .sbar input{flex-basis:100%}
  .sbar .ftoggle,.sbar select{flex:1}
  .rtable{display:none}
  .hl{margin:0 -16px 4px;padding:2px 16px 10px;grid-auto-columns:78%}
  .pstats{grid-template-columns:repeat(2,1fr)}
  .pgrid{grid-template-columns:1fr}
  .avatar{width:68px;height:68px;font-size:24px}
  .yeartbl td:nth-child(5),.yeartbl th:nth-child(5){display:none}
  .day{width:36px;height:36px}
  .toast{left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));max-width:none}
  .sheet{position:fixed;bottom:0;left:0;right:0;width:100%;border-radius:20px 20px 0 0;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
  .scrim{align-items:flex-end}
  .proto{bottom:74px}
}
</style>
</head>
<body>

<script>
// ---------- temas ----------
const THEMES = [
  {id:'system', n:'Sistema', d:'Sigue el modo del dispositivo'},
  {id:'light', n:'Claro'}, {id:'dark', n:'Oscuro'}, {id:'oled', n:'Negro OLED', d:'Ahorra batería'},
  {id:'contraste', n:'Alto contraste', d:'Máxima legibilidad'},
  {id:'bosque', n:'Bosque'}, {id:'oceano', n:'Océano'}, {id:'atardecer', n:'Atardecer'},
];
const DARK_THEMES = new Set(['dark','oled','bosque']);
const sysDark = matchMedia('(prefers-color-scheme: dark)');
let themeId = 'system';
try { themeId = localStorage.getItem('os-theme') || 'system'; } catch (_) {}
function isDarkTheme() { return DARK_THEMES.has(themeId) || (themeId === 'system' && sysDark.matches); }
function applyTheme(id, save = true) {
  themeId = THEMES.some(x => x.id === id) ? id : 'system';
  const root = document.documentElement;
  if (themeId === 'system') delete root.dataset.theme; else root.dataset.theme = themeId;
  root.classList.toggle('is-dark', isDarkTheme());
  document.querySelector('meta[name="theme-color"]').content = getComputedStyle(root).getPropertyValue('--surface').trim();
  if (save) try { localStorage.setItem('os-theme', themeId); } catch (_) {}
  document.querySelectorAll('[data-pick]').forEach(b => b.setAttribute('aria-pressed', b.dataset.pick === themeId));
  if (window.__booted && state.route !== 'settings') render();  // mapas y gráficas se redibujan con el nuevo tema
}
window.setTheme = id => applyTheme(id);
sysDark.addEventListener('change', () => themeId === 'system' && applyTheme('system', false));
applyTheme(themeId, false);

const D = window.OS_DATA;
const A = D.activities, byId = Object.fromEntries(A.map(a => [String(a.id), a]));
const SPORT = {
  run:{n:'Carrera', c:'var(--run)', ic:'<path d="M13 4a2 2 0 1 0 0 .01M8 21l3-6 3 3v3M6 12l3-4 4 1 3 4 3 1"/>'},
  ride:{n:'Ciclismo', c:'var(--ride)', ic:'<circle cx="6" cy="17" r="3.5"/><circle cx="18" cy="17" r="3.5"/><path d="M6 17l4-8h5l3 8M10 9l2 8h-6M14 6h3"/>'},
  strength:{n:'Fuerza', c:'var(--strength)', ic:'<path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/>'},
  walk:{n:'Caminar', c:'var(--walk)', ic:'<path d="M13 4a2 2 0 1 0 0 .01M10 21l2-7 3 3v4M9 11l2-3 3 1 2 4"/>'},

// ---------- ondas animadas del panel de acceso (canvas 2D, sin librerías) ----------
let waveRAF = null, waveRO = null;
function stopWaves() { if (waveRAF) cancelAnimationFrame(waveRAF); waveRAF = null; if (waveRO) waveRO.disconnect(); waveRO = null; }
function startWaves() {
  stopWaves();
  const cv = document.querySelector('.lart canvas.waves'); if (!cv) return;
  const ctx = cv.getContext('2d'), reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0;
  const size = () => { const r = cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
  size(); waveRO = new ResizeObserver(() => { size(); if (reduce) draw(0); }); waveRO.observe(cv);
  const color = getComputedStyle(cv.parentElement).color;
  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    const n = Math.ceil(H / 30) + 2;
    for (let k = 0; k < n; k++) {
      const base = 20 + k * 30, amp = 16 + (k % 5) * 5, ph = k * 0.7;
      ctx.beginPath();
      for (let x = -20; x <= W + 20; x += 12) {
        // dos ondas superpuestas que se desplazan muy despacio, cada línea con su propio ritmo
        const y = base + Math.sin(x / 110 + ph + t * 0.00018 * (1 + (k % 3) * 0.25)) * amp
                       + Math.sin(x / 47 + k - t * 0.00031) * amp * 0.35;
        x === -20 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = color; ctx.globalAlpha = k % 4 === 0 ? 0.32 : 0.18; ctx.lineWidth = k % 4 === 0 ? 1.6 : 1;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  if (reduce) { draw(0); return; }
  const loop = t => { if (!document.hidden) draw(t); waveRAF = requestAnimationFrame(loop); };
  waveRAF = requestAnimationFrame(loop);
}

function bindPeriod(root, rerender) {

}
function sums(list) {
  return list.reduce((s, a) => ({n: s.n + 1, dist: s.dist + a.dist, time: s.time + a.moving, asc: s.asc + (a.asc || 0), eff: s.eff + (a.trimp || 0)}), {n: 0, dist: 0, time: 0, asc: 0, eff: 0});
}

  return `<div class="psum num">
    <div><b>${s.n}</b><span>actividades</span> ${delta('n')}</div>
    <div><b>${Math.round(s.dist / 1000).toLocaleString('es-ES')} km</b><span>distancia</span> ${delta('dist')}</div>
    <div><b>${Math.round(s.time / 3600).toLocaleString('es-ES')} h</b><span>tiempo</span> ${delta('time')}</div>
    <div><b>${Math.round(s.asc).toLocaleString('es-ES')} m</b><span>desnivel</span> ${delta('asc')}</div>
  </div>${q ? '<div class="note" style="margin:-8px 0 12px">Las flechas comparan con el mismo periodo del año anterior.</div>' : ''}`;
}

const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
function weekHeader(w) {

  </section>`;
}
function goals() {
  let saved = {}; try { saved = JSON.parse(localStorage.getItem('os-goals') || '{}'); } catch (_) {}
  const now = new Date(), mon = startOfWeek(now), m0 = new Date(now.getFullYear(), now.getMonth(), 1), y0 = new Date(now.getFullYear(), 0, 1);
  const from = {semana: mon, mes: m0, 'año': y0};
  return P.goals.map(g => {
    const target = saved[g.id] ?? g.target;
    const val = A.filter(a => dt(a.start) >= from[g.period]).reduce((s, a) => s + (g.metric === 'dist' ? a.dist : a.moving), 0);
    // proyección lineal a fin de periodo
    const end = g.period === 'semana' ? new Date(+mon + 7*864e5) : g.period === 'mes' ? new Date(now.getFullYear(), now.getMonth()+1, 1) : new Date(now.getFullYear()+1, 0, 1);
    const frac = (now - from[g.period]) / (end - from[g.period]);
    return {...g, target, val, pct: val/target, proj: frac > 0 ? val/frac : val};
  });
}

}

    m.addLayer({id:'route', type:'line', source:'route', paint:{'line-color':['get','c'], 'line-width':4.5}, layout:{'line-join':'round','line-cap':'round'}});
    m.addSource('pts', {type:'geojson', data:{type:'FeatureCollection', features:[
      {type:'Feature', properties:{c:'#2f9e44'}, geometry:{type:'Point', coordinates:coords[0]}},
      {type:'Feature', properties:{c:'#17191a'}, geometry:{type:'Point', coordinates:coords[coords.length-1]}}]}});
    m.addLayer({id:'pts', type:'circle', source:'pts', paint:{'circle-radius':7, 'circle-color':['get','c'], 'circle-stroke-color':'#fff', 'circle-stroke-width':2.5}});
    m.addSource('cur', {type:'geojson', data:{type:'FeatureCollection', features:[]}});
    m.addLayer({id:'cur', type:'circle', source:'cur', paint:{'circle-radius':6, 'circle-color':'#fff', 'circle-stroke-color':'#17191a', 'circle-stroke-width':3}});
  }
  m.on('load', addLayers);
  m.on('mousemove', e => {
    if (!api.onHover) return; let best = -1, bd = Infinity;
    idx.forEach((i, k) => { const p = m.project(coords[k]); const d = (p.x-e.point.x)**2 + (p.y-e.point.y)**2; if (d < bd) { bd = d; best = i; } });
    if (bd < 400) api.onHover(best);
  });
  const api = {
    onHover:null,
    color(vals, mode) { colored = segments(vals, mode); const s = m.getSource('route'); if (s) s.setData(colored); },
    setCursor(i) { const s = m.getSource('cur'); if (!s || S.lat[i] == null) return; s.setData({type:'FeatureCollection', features:[{type:'Feature', properties:{}, geometry:{type:'Point', coordinates:[S.lon[i], S.lat[i]]}}]}); },
  };
  return api;
}

// ---------- estadísticas ----------
function renderStats() {
  const p = state.sp, r = periodRange(p), pr = prevRange(p);
  const list = A.filter(a => inPeriod(a, p)), prev = pr ? A.filter(a => inRange(a, pr)) : null;
  const days = D.daily.filter(x => { const d = dt(x.date); return d >= r[0] && d <= r[1]; });
  const last = D.daily[D.daily.length - 1];
  const form = last.tsb > 5 ? 'Fresco' : last.tsb > -10 ? 'Neutro' : last.tsb > -30 ? 'Productivo' : 'Sobrecarga';
  // récords y curva de potencia del periodo, comparados con los de siempre
  const best = {}; list.forEach(a => a.best.forEach(b => { if (!best[b.label] || b.t < best[b.label].t) best[b.label] = {...b, id: a.id, date: a.start.slice(0, 10)}; }));
  const prs = D.prs.map(x => best[x.label]).filter(Boolean);
  const pc = {}; list.forEach(a => a.pcurve.forEach(x => { if (!pc[x.s] || x.w > pc[x.s].w) pc[x.s] = x; }));
  const pcur = Object.values(pc).sort((a, b) => a.s - b.s);
  const pr5 = best['5 km'], riegel = (t, d1, d2) => t * Math.pow(d2 / d1, 1.06);
  view.innerHTML = `<div class="pad">${isMobile() ? '' : '<h1 style="margin-bottom:12px">Estadísticas</h1>'}
    <h2 style="margin:0 0 10px">Ahora</h2>
    ${highlights()}
    <h2 style="margin:14px 0 10px">Por periodo</h2>
    ${periodBar(p, 'sp', false)}
    ${periodSummary(list, prev)}
    <div class="panel"><div class="ph"><h2>Forma y frescura · ${periodLabel(p)}</h2><div class="flegend"><span><i style="background:var(--ctl)"></i>Forma (42 d)</span><span><i style="background:var(--atl)"></i>Fatiga (7 d)</span><span><i style="background:var(--tsbp)"></i>Frescura</span></div></div>
      <div class="pb"><div class="tsbnow num"><div><b>${last.ctl.toFixed(0)}</b><span>Forma hoy</span></div><div><b>${last.atl.toFixed(0)}</b><span>Fatiga hoy</span></div><div><b>${last.tsb > 0 ? '+' : ''}${last.tsb.toFixed(0)}</b><span>Frescura · ${form}</span></div></div>${days.length > 1 ? fitnessChart(days) : '<div class="note">Sin datos en este periodo.</div>'}</div></div>
    <div class="statgrid">
      ${volumePanel(list, p)}
      ${progressPanel(p)}
      <div class="panel"><div class="ph"><h2>Mejores tiempos · ${periodLabel(p)}</h2></div>${prs.length ? `<table class="num"><thead><tr><th>Distancia</th><th>Tiempo</th><th>Ritmo</th><th>Fecha</th></tr></thead><tbody>${prs.map(b => { const all = D.prs.find(x => x.label === b.label); const isPR = String(all.id) === String(b.id); return `<tr><td>${b.label}</td><td>${fmtDur(b.t)} ${isPR ? '🏆' : ''}</td><td>${fmtPace(b.d / b.t)}</td><td><a href="#/a/${b.id}" style="color:var(--accent)">${dt(b.date).toLocaleDateString('es-ES', {day: 'numeric', month: 'short', year: p.y === 'all' || p.y === 'last12' ? 'numeric' : undefined})}</a></td></tr>`; }).join('')}</tbody></table><div class="pb note">🏆 = récord de siempre. ${p.y === 'all' ? '' : 'El resto, lo mejor de este periodo.'}</div>` : '<div class="pb note">Sin carreras con distancia medida en este periodo.</div>'}</div>
      <div class="panel"><div class="ph"><h2>Predicción de carrera</h2></div>${pr5 ? `<table class="num"><thead><tr><th>Prueba</th><th>Tiempo estimado</th><th>Ritmo</th></tr></thead><tbody>${[[10000, '10 km'], [21097, 'Media maratón'], [42195, 'Maratón']].map(([d, n]) => { const tt = riegel(pr5.t, 5000, d); return `<tr><td>${n}</td><td>${fmtDur(tt)}</td><td>${fmtPace(d / tt)} /km</td></tr>`; }).join('')}</tbody></table><div class="pb note">Riegel a partir de tu mejor 5 km del periodo (${fmtDur(pr5.t)}).</div>` : '<div class="pb note">Hace falta un 5 km en este periodo.</div>'}</div>
      <div class="panel"><div class="ph"><h2>Curva de potencia</h2><div class="legend"><i style="width:14px;background:var(--ride)"></i>periodo <i style="width:14px;background:var(--line);margin-left:8px"></i>de siempre</div></div><div class="pb">${pcur.length ? powerCurve(pcur, D.pcurve) : '<div class="note">Sin datos de potencia en este periodo.</div>'}</div></div>
    </div></div>`;
  bindPeriod(view, renderStats);
  view.querySelectorAll('[data-href]').forEach(el => el.onclick = () => go(el.dataset.href));
  setupProgress();
  view.querySelectorAll('[data-vm]').forEach(b => b.onclick = () => { state.vm = b.dataset.vm; renderStats(); });
}
function volumePanel(list, p) {
  // cubetas según el periodo: años (todo), meses (un año o 12 meses) o días (un mes)
  const unit = p.y === 'all' ? 'y' : p.m !== 'all' ? 'd' : 'm', metric = state.vm || 'time';
  const keyOf = a => unit === 'y' ? a.start.slice(0, 4) : unit === 'm' ? a.start.slice(0, 7) : a.start.slice(0, 10);
  const keys = []; const [f, to] = periodRange(p);
  if (unit === 'y') for (let y = +YEARS[YEARS.length - 1]; y <= +YEARS[0]; y++) keys.push(String(y));
  else if (unit === 'm') { const d = new Date(f.getFullYear(), f.getMonth(), 1); while (d <= to) { keys.push(`${d.getFullYear()}-${pad2(d.getMonth() + 1)}`); d.setMonth(d.getMonth() + 1); } }
  else { const d = new Date(f); while (d <= to) { keys.push(ymd(d)); d.setDate(d.getDate() + 1); } }
  const B = Object.fromEntries(keys.map(k => [k, {}]));
  list.forEach(a => { const b = B[keyOf(a)]; if (b) b[a.sport] = (b[a.sport] || 0) + (metric === 'time' ? a.moving / 3600 : a.dist / 1000); });
  const tot = k => Object.values(B[k]).reduce((x, y) => x + y, 0), max = Math.max(1, ...keys.map(tot));
  const lbl = k => unit === 'y' ? `'${k.slice(2)}` : unit === 'm' ? MONTHS[+k.slice(5) - 1].slice(0, 3) : +k.slice(8);
  const SP = ['run', 'ride', 'strength', 'walk', 'row', 'swim', 'other'];
  return `<div class="panel"><div class="ph"><h2>Volumen por ${unit === 'y' ? 'año' : unit === 'm' ? 'mes' : 'día'}</h2><div class="seg"><button data-vm="time" class="${metric === 'time' ? 'on' : ''}">Horas</button><button data-vm="dist" class="${metric === 'dist' ? 'on' : ''}">Km</button></div></div>
    <div class="pb"><div class="vbars ${keys.length > 16 ? 'many' : ''}">${keys.map(k => { const tt = tot(k); return `<div class="col" title="${k}: ${tt.toFixed(1)} ${metric === 'time' ? 'h' : 'km'}"><span class="lbl num">${tt ? Math.round(tt) : ''}</span><div class="stack" style="height:${tt / max * 110}px">${SP.map(s => B[k][s] ? `<i style="height:${B[k][s] / tt * 100}%;background:${SPORT[s].c}"></i>` : '').join('')}</div><span class="lbl">${keys.length > 16 && unit === 'd' && +k.slice(8) % 5 !== 1 ? '' : lbl(k)}</span></div>`; }).join('')}</div>
    <div class="flegend" style="margin-top:8px">${['run', 'ride', 'strength', 'walk', 'row'].map(s => `<span><i style="background:${SPORT[s].c}"></i>${SPORT[s].n}</span>`).join('')}</div></div></div>`;
}
// progreso anual: distancia acumulada por día del año, una línea por año
function progressPanel(p) {
  const sp = state.ps || 'run';
  return `<div class="panel"><div class="ph"><h2>Progreso anual</h2><div class="seg" id="psport">${[['run', 'Carrera'], ['ride', 'Ciclismo'], ['all', 'Todo']].map(([k, n]) => `<button data-ps="${k}" class="${sp === k ? 'on' : ''}">${n}</button>`).join('')}</div></div>
    <div class="pb prog"><svg id="progsvg" viewBox="0 0 1000 260" preserveAspectRatio="none"></svg><div class="tip num" id="progtip">Pasa el cursor para comparar años en la misma fecha.</div></div></div>`;
}
function setupProgress() {
  const svg = $('#progsvg'); if (!svg) return;
  const sp = state.ps || 'run', sel = state.sp.y === 'all' || state.sp.y === 'last12' ? new Date().getFullYear() : +state.sp.y;
  const doy = s => { const d = dt(s); return Math.floor((d - new Date(d.getFullYear(), 0, 1)) / 864e5); };
  const series = {};
  A.filter(a => sp === 'all' || a.sport === sp).forEach(a => { const y = +a.start.slice(0, 4); (series[y] = series[y] || new Array(366).fill(0))[doy(a.start)] += a.dist / 1000; });
  Object.values(series).forEach(arr => { for (let i = 1; i < 366; i++) arr[i] += arr[i - 1]; });
  const years = Object.keys(series).map(Number).sort();
  const today = new Date(), todayDoy = doy(ymd(today));
  const max = Math.max(1, ...years.map(y => series[y][y === today.getFullYear() ? todayDoy : 365])) * 1.05;
  const X = i => i / 365 * 1000, Y = v => 250 - v / max * 235;
  const path = y => { const end = y === today.getFullYear() ? todayDoy : 365; return 'M' + series[y].slice(0, end + 1).map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' L'); };
  const monthTicks = MONTHS.map((m, i) => doy(`${today.getFullYear()}-${pad2(i + 1)}-01`));
  svg.innerHTML = monthTicks.map(d => `<line x1="${X(d)}" x2="${X(d)}" y1="0" y2="250" stroke="var(--line)" vector-effect="non-scaling-stroke"/>`).join('') +
    years.filter(y => y !== sel).map(y => `<path d="${path(y)}" fill="none" stroke="var(--muted)" stroke-opacity=".35" stroke-width="1.4" vector-effect="non-scaling-stroke"/>`).join('') +
    (series[sel] ? `<path d="${path(sel)}" fill="none" stroke="var(--accent)" stroke-width="3" vector-effect="non-scaling-stroke"/>` : '') +
    `<line id="pcur" x1="-5" x2="-5" y1="0" y2="250" stroke="var(--fg)" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  const tip = $('#progtip');
  const show = i => {
    $('#pcur').setAttribute('x1', X(i)); $('#pcur').setAttribute('x2', X(i));
    const date = new Date(today.getFullYear(), 0, 1 + i).toLocaleDateString('es-ES', {day: 'numeric', month: 'short'});
    const vals = years.filter(y => y !== today.getFullYear() || i <= todayDoy).map(y => [y, series[y][i]]).sort((a, b) => b[1] - a[1]);
    tip.innerHTML = `<b>A ${date}</b> · ` + vals.slice(0, 6).map(([y, v]) => `${y === sel ? '<b>' : ''}${y}: ${Math.round(v)} km${y === sel ? '</b>' : ''}`).join(' · ');
  };
  const move = cx => { const r = svg.getBoundingClientRect(); show(Math.max(0, Math.min(365, Math.round((cx - r.left) / r.width * 365)))); };
  svg.onmousemove = e => move(e.clientX); svg.ontouchmove = e => move(e.touches[0].clientX);
  show(Math.min(todayDoy, 365));
  document.querySelectorAll('[data-ps]').forEach(b => b.onclick = () => { state.ps = b.dataset.ps; renderStats(); });
}
function fitnessChart(d) {
  const W = 1000, H = 220, n = d.length, X = i => i / (n - 1) * W;
  const max = Math.max(...d.map(x => Math.max(x.ctl, x.atl))) * 1.1 || 1, mid = 150;
  const Y = v => mid - v / max * (mid - 10), tmax = Math.max(...d.map(x => Math.abs(x.tsb))) || 1, TY = v => 185 - v / tmax * 30;
  const step = n > 800 ? 'year' : n > 45 ? 'month' : 'week';
  const ticks = d.map((x, i) => [x.date, i]).filter(([s]) => step === 'year' ? s.endsWith('-01-01') : step === 'month' ? s.endsWith('-01') : dt(s).getDay() === 1);
  const bw = Math.max(1, W / n * .8);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:220px;display:block">
    ${ticks.map(([s, i]) => `<line x1="${X(i)}" x2="${X(i)}" y1="0" y2="${H}" stroke="var(--line)" vector-effect="non-scaling-stroke"/>`).join('')}
    <line x1="0" x2="${W}" y1="185" y2="185" stroke="var(--line)" vector-effect="non-scaling-stroke"/>
    ${n <= 800 ? d.map((x, i) => `<rect x="${X(i) - bw / 2}" width="${bw}" y="${Math.min(185, TY(x.tsb))}" height="${Math.abs(TY(x.tsb) - 185)}" fill="${x.tsb >= 0 ? 'var(--tsbp)' : 'var(--tsbn)'}" opacity=".8"/>`).join('') : ''}
    <path d="M${d.map((x, i) => `${X(i).toFixed(1)},${Y(x.atl).toFixed(1)}`).join(' L')}" fill="none" stroke="var(--atl)" stroke-width="1.4" stroke-opacity="${n > 800 ? .5 : 1}" vector-effect="non-scaling-stroke"/>
    <path d="M0,${mid} L${d.map((x, i) => `${X(i).toFixed(1)},${Y(x.ctl).toFixed(1)}`).join(' L')} L${W},${mid} Z" fill="var(--ctl)" opacity=".12"/>
    <path d="M${d.map((x, i) => `${X(i).toFixed(1)},${Y(x.ctl).toFixed(1)}`).join(' L')}" fill="none" stroke="var(--ctl)" stroke-width="2.6" vector-effect="non-scaling-stroke"/>
  </svg><div class="flegend num" style="justify-content:space-between">${ticks.filter((_, k, arr) => arr.length <= 16 || k % Math.ceil(arr.length / 16) === 0).map(([s]) => `<span>${step === 'year' ? s.slice(0, 4) : step === 'month' ? dt(s).toLocaleDateString('es-ES', {month: 'short'}) : +s.slice(8)}</span>`).join('')}</div>`;
}

    <div class="themes">${THEMES.map(th => `<button class="theme" data-pick="${th.id}" aria-pressed="${th.id === themeId}">

    <div class="field"><div><b>Zona de privacidad</b><div class="note">Oculta 300 m alrededor de casa en todo lo que compartas</div></div>${sw(true)}</div>
    <h2 style="margin:10px 0 0">Garmin</h2>
    <div class="field"><div><b>Clave de la Personal API</b><div class="note">Activa · caduca el 7 nov 2027 · te avisaremos 2 semanas antes</div></div><span style="color:var(--accent);font-weight:600">● Conectada</span></div>
    <div class="field"><div><b>Sincronización automática</b><div class="note">Cada 15 min desde Railway</div></div>${sw(true)}</div>
    <h2 style="margin:10px 0 0">Notificaciones y dispositivos</h2>
    <div class="field"><div><b>Actividad nueva y récords</b><div class="note">Web Push en este navegador</div></div>${sw(true)}</div>
    <div class="field"><div><b>Este dispositivo</b><div class="note">${isMobile() ? 'Chrome · Android' : 'Chrome · Linux'} · sesión activa</div></div><button class="btn" data-logout>Cerrar sesión</button></div>
  </div></div>`;
  view.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => applyTheme(b.dataset.pick));
  view.querySelectorAll('[data-logout]').forEach(b => b.onclick = logout);

// ---------- sincronización (simulada) ----------
const STEPS = ['Renovando token de Garmin', 'Buscando actividades nuevas', 'Descargando FIT original', 'Calculando métricas y récords', 'Actualizando forma y frescura'];
function lastSyncText() { const t = new Date(); return 'Última sincronización: hoy, ' + t.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'}); }
$('#lastsync1').textContent = lastSyncText();
document.querySelectorAll('[data-sync]').forEach(b => b.onclick = runSync);
$('#closesync').onclick = () => $('#scrim').classList.remove('open');
function runSync() {
  const ul = $('#steps'), prog = $('#prog');
  ul.innerHTML = STEPS.map(s => `<li><span class="dot"></span>${s}</li>`).join('');
  $('#scrim').classList.add('open'); prog.style.width = '0';
  let i = 0;
  const tick = () => {
    const lis = ul.querySelectorAll('li');
    if (i > 0) { lis[i-1].className = 'done'; lis[i-1].querySelector('.dot').textContent = '✓'; }
    if (i < lis.length) { lis[i].className = 'run'; prog.style.width = (i / lis.length * 100) + '%'; i++; setTimeout(tick, 650); }
    else { prog.style.width = '100%'; $('#lastsync1').textContent = lastSyncText(); setTimeout(() => { $('#scrim').classList.remove('open'); toast(A[0]); }, 500); }
  };
  tick();
}
function toast(a) {
  const t = $('#toast');
  t.innerHTML = `${icon(a.sport, 38)}<div><b>Nueva actividad sincronizada</b><div class="note">${a.name} · ${a.dist ? fmtKm(a.dist)+' km · ' : ''}${fmtDur(a.moving)} · esfuerzo ${a.trimp}</div></div>`;
  t.onclick = () => { t.classList.remove('show'); go('#/a/' + a.id); };
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 4200);
}

window.__booted = true;
parse();
