name: Android

# The app's release build (OS-502), as a check that the native side still compiles: only when what it
# depends on changes (the Expo config and plugins, native modules, dependencies). JavaScript-only
# changes are covered by lint, types and unit tests in CI's web job. The APK is not kept: CI has no
# signing key, and builds for the phone are made locally.
on:
  pull_request:
    paths:
      - 'apps/mobile/app.config.ts'
      - 'apps/mobile/package.json'
      - 'apps/mobile/modules/**'
      - 'apps/mobile/plugins/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/app.config.ts'
      - 'apps/mobile/package.json'
      - 'apps/mobile/modules/**'
      - 'apps/mobile/plugins/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android release build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable pnpm (version from package.json)
        run: corepack enable pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      - name: Free disk space (the native build needs several GB)
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate the native project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild -p android --no-install
        env:
          CI: '1'
      - name: Build the release APK (arm64)
        working-directory: apps/mobile/android
        # Fewer parallel native compilations and a bounded heap: the hosted runner has little memory.
        run: >-
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
