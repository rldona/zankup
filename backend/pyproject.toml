[project]
name = "zankup"
version = "0.1.0"
description = "Zankup backend: API, Garmin sync and computation engine"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "zankup-metrics",
  "pydantic-settings>=2.8",
  "sqlalchemy>=2.0",
  "alembic>=1.15",
  "psycopg[binary]>=3.2",
  "httpx>=0.28",
  "fitdecode>=0.10",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "pyjwt>=2.10",
  "cryptography>=44",
  "boto3>=1.38",
  "webauthn>=3.0.1",
  "segno>=1.6.6",
  "pillow>=11",
  "anthropic>=2.3.0",
]

[tool.uv.sources]
zankup-metrics = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zankup"]
