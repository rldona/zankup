<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" role="img" aria-label="OpenSport">
  <!-- Three symmetric, rounded peaks; a switchback trail climbs the central one and ends in a soft arrow -->
  <defs>
    <mask id="trail">
      <rect width="120" height="90" fill="#fff"/>
      <path d="M48.8 86 L63.4 66 L51.4 57 L58.3 49" fill="none" stroke="#000" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
      <polygon points="64.9,33.8 53,44.7 64.4,51.3" fill="#000" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g mask="url(#trail)" fill="#000" stroke="#000" stroke-width="9" stroke-linejoin="round">
    <polygon points="17,80 34.2,49 51.4,80"/>
    <polygon points="68.6,80 85.8,49 103,80"/>
    <polygon points="30.8,80 60,15 89.2,80"/>
  </g>
</svg>
