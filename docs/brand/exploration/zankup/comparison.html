<!doctype html><html lang="es"><meta charset="utf-8"><title>Zankup · ronda final</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&family=Sora:wght@700&display=swap">
<style>
body{margin:0;font:14px system-ui;background:#f4f5f3;color:#111;padding:24px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.opt{background:#fff;border-radius:16px;padding:16px;display:grid;gap:12px;justify-items:center}
.opt h2{margin:0;font-size:14px}.big{width:200px;height:150px;color:#111}
.pair{display:flex;gap:10px}.ico{width:64px;height:64px;border-radius:16px;display:grid;place-items:center}.ico svg{width:42px;height:42px}
.dark{background:#111;color:#fff}.light{background:#fff;color:#111;border:3px solid #111}.green{background:#0b8f6a;color:#fff}
.tiny{display:flex;gap:10px;align-items:center}.tiny svg{width:16px;height:16px}.tiny .s24 svg{width:24px;height:24px}.tiny .s32 svg{width:32px;height:32px}
.word{display:flex;align-items:center;gap:10px;font-size:26px;letter-spacing:-.03em}.word svg{width:40px;height:30px}
</style>
<svg width="0" height="0" style="position:absolute"><defs>
  <mask id="mzA"><rect width="120" height="90" fill="#fff"/>
    <path d="M44 61 L76 61 L46 79 L78 79" fill="none" stroke="#000" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/></mask>
  <mask id="mzB"><rect width="120" height="90" fill="#fff"/>
    <path d="M78 79 L48 79 L76 61 L58 61" fill="none" stroke="#000" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="45,61 55,54 55,68" fill="#000" stroke="#000" stroke-width="3" stroke-linejoin="round"/></mask>
  <symbol id="zA" viewBox="0 0 120 90"><g mask="url(#mzA)" fill="currentColor" stroke="currentColor" stroke-width="9" stroke-linejoin="round">
    <polygon points="17,80 34.2,49 51.4,80"/><polygon points="68.6,80 85.8,49 103,80"/><polygon points="30.8,80 60,15 89.2,80"/></g></symbol>
  <symbol id="zB" viewBox="0 0 120 90"><g mask="url(#mzB)" fill="currentColor" stroke="currentColor" stroke-width="9" stroke-linejoin="round">
    <polygon points="17,80 34.2,49 51.4,80"/><polygon points="68.6,80 85.8,49 103,80"/><polygon points="30.8,80 60,15 89.2,80"/></g></symbol>
  <symbol id="zC" viewBox="0 0 120 90">
    <path d="M24 32 H96 L24 74 H96" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="96,9 85,27 107,27" fill="currentColor" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/></symbol>
</defs></svg>
<div class="row">
  <div class="opt"><h2>ZA · Z en la montaña, limpia</h2><svg class="big"><use href="#zA"/></svg></div>
  <div class="opt"><h2>ZB · Z en la montaña, con flecha</h2><svg class="big"><use href="#zB"/></svg></div>
  <div class="opt"><h2>ZC · Monograma Z con cima</h2><svg class="big"><use href="#zC"/></svg></div>
</div>
<script>
document.querySelectorAll('.opt').forEach(o => {
  const id = o.querySelector('use').getAttribute('href'); const s = `<svg><use href="${id}"/></svg>`;
  o.insertAdjacentHTML('beforeend', `<div class="pair"><div class="ico dark">${s}</div><div class="ico light">${s}</div><div class="ico green">${s}</div></div>
  <div class="word" style="font-family:Manrope;font-weight:800">${s}Zankup</div><div class="word" style="font-family:Sora;font-weight:700">${s}Zankup</div>
  <div class="tiny">${s}<span class="s24">${s}</span><span class="s32">${s}</span></div>`);
});
</script></html>
