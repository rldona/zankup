# Zankup on your own server (OS-224): Postgres, the API with its worker, and the PWA behind Caddy,
# all on one origin. Steps in docs/self-hosting.md. Run from the repository root:
#
#   cp .env.example .env    # then fill it in
#   docker compose -f deploy/compose.yaml up -d --build
#
# Data lives in two volumes: the database and /data (the original FIT files). Back them up (OS-114).
name: zankup

services:
  db:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zankup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: zankup
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zankup -d zankup']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # Migrations run on every start, so upgrading is pulling and starting again.
    command: sh -c "alembic -c backend/alembic.ini upgrade head && exec uvicorn zankup.api.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    env_file: ../.env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://zankup:${POSTGRES_PASSWORD}@db:5432/zankup
      DATA_DIR: /data
      PG_DUMP_COMMAND: pg_dump
      PG_RESTORE_COMMAND: pg_restore
    volumes:
      - rawdata:/data
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 30
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      ZANKUP_SITE: ${ZANKUP_SITE:-:8080}
    ports:
      - '80:80'
      - '443:443'
      - '8080:8080'
    volumes:
      - caddy:/data
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  rawdata:
  caddy:
