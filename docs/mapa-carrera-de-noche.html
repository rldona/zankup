<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrera de noche</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#f6f6f4;--card:#fff;--fg:#1d1d1b;--muted:#6b6b66;--line:#e2e2dc;--accent:#e8590c;--grid:#ececE6;--area:#d9d9d2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--card:#1f1f1d;--fg:#ededE8;--muted:#9a9a92;--line:#33332f;--accent:#ff7a2e;--grid:#2a2a27;--area:#3a3a35}}
:root[data-theme="dark"]{--bg:#151514;--card:#1f1f1d;--fg:#ededE8;--muted:#9a9a92;--line:#33332f;--accent:#ff7a2e;--grid:#2a2a27;--area:#3a3a35}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 2px}
.sub{color:var(--muted);margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--fg);padding:5px 10px;cursor:pointer;font:inherit}
.seg button.on{background:var(--accent);color:#fff}
label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
#legend{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
#legend i{display:inline-block;width:90px;height:8px;border-radius:4px}
#map{height:460px}
#chart{display:block;width:100%;height:170px;cursor:crosshair}
#readout{padding:6px 12px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;min-height:28px;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:7px 12px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;font-size:12px}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--grid)}
.note{color:var(--muted);font-size:12px}
@media (max-width:600px){#map{height:340px}#legend{margin-left:0}}
</style>
</head>

<main>

  </table>
</div>

.529],[40.562124,-3.612798,6520.9,2227,639.6,145,162,2.622],[40.562155,-3.612745,6526.5,2228,639.6,145,162,2.631],[40.562173,-3.612721,6529.3,2229,639.6,146,160,2.622],[40.562197,-3.612695,6532.7,2230,639.6,146,160,2.613],[40.56222,-3.612678,6535.7,2231,639.6,145,160,2.613],[40.562241,-3.61266,6538.5,2232,639.6,145,160,2.613],[40.562259,-3.612641,6541.1,2233,639.6,145,162,2.622],[40.562278,-3.612625,6543.6,2234,640.0,145,162,2.669],[40.562298,-3.612608,6546.1,2235,640.0,145,162,2.678],[40.562323,-3.612584,6549.6,2236,639.4,144,162,2.678],[40.562369,-3.612527,6556.4,2237,639.4,144,164,2.706],[40.5624,-3.612488,6561.0,2238,639.4,144,164,2.79],[40.562427,-3.612455,6565.1,2239,640.0,144,164,2.79],[40.562447,-3.612432,6568.0,2240,640.2,144,162,2.771],[40.56247,-3.612409,6571.2,2241,640.2,144,162,2.725],[40.562488,-3.612388,6573.9,2242,640.2,144,162,2.725],[40.562504,-3.612366,6576.5,2243,640.2,144,164,2.715],[40.562526,-3.612344,6579.6,2244,640.2,144,164,2.697],[40.562546,-3.612324,6582.3,2245,640.0,145,164,2.687],[40.562563,-3.612302,6584.9,2246,640.2,145,162,2.687],[40.562576,-3.612279,6587.3,2247,640.4,145,160,2.669],[40.562599,-3.61226,6590.3,2248,640.6,145,160,2.659],[40.562633,-3.612236,6594.6,2249,641.4,145,160,2.659],[40.56266,-3.612211,6598.2,2250,642.0,146,160,2.687],[40.56268,-3.612195,6600.8,2251,642.0,146,160,2.687],[40.562705,-3.612178,6603.9,2252,642.0,146,162,2.687],[40.562726,-3.61216,6606.6,2253,642.6,146,162,2.687],[40.562746,-3.612143,6609.4,2254,642.6,146,162,2.706],[40.562764,-3.61212,6612.2,2255,642.6,146,162,2.715],[40.562776,-3.612109,6613.7,2256,642.8,146,158,2.715],[40.562787,-3.612101,6615.2,2257,643.8,146,158,2.687]],"laps":[{"d":1000,"t":340,"hr":139,"asc":2,"desc":3},{"d":1000,"t":334,"hr":145,"asc":2,"desc":14},{"d":1000,"t":341,"hr":149,"asc":13,"desc":11},{"d":1000,"t":344,"hr":151,"asc":15,"desc":13},{"d":1000,"t":343,"hr":150,"asc":7,"desc":5},{"d":1000,"t":336,"hr":151,"asc":9,"desc":16},{"d":615,"t":218,"hr":149,"asc":9,"desc":10}],"session":{"start":"2026-10-27T17:21:00+00:00","dist":6615.16,"time":2255.866,"asc":60,"kcal":574,"hr":148,"hrmax":159,"cad":164,"te":3.5}};
const P = D.pts.map(p => ({lat:p[0], lon:p[1], d:p[2], t:p[3], ele:p[4], hr:p[5], cad:p[6], v:p[7]}));
const S = D.session;

const fmtT = s => { s = Math.round(s); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(x).padStart(2,'0'); };
const fmtPace = v => v > 0.5 ? fmtT(1000/v) + ' /km' : '—';

// Ritmo suavizado: velocidad media en una ventana de ±10 s
P.forEach((p, i) => { const a = P[Math.max(0, i-10)], b = P[Math.min(P.length-1, i+10)];
  p.vs = (b.t - a.t) > 0 ? (b.d - a.d) / (b.t - a.t) : p.v; });

// Cabecera
const start = new Date(S.start);
document.getElementById('sub').textContent = start.toLocaleString('es-ES', {weekday:'long', day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit'}) + ' · Garmin Fēnix 6X';
const stats = [
  [(Math.floor(S.dist/10)/100).toFixed(2).replace('.', ',') + ' km', 'Distancia'],
  [fmtT(P[P.length-1].t), 'Tiempo'],
  [fmtPace(S.dist/S.time).replace(' /km',''), 'Ritmo /km'],
  [S.asc + ' m', 'Desnivel +'],
  [S.hr + ' ppm', 'FC media (máx ' + S.hrmax + ')'],
  [S.cad + ' ppm', 'Cadencia'],
  [S.kcal, 'Calorías'],
];
document.getElementById('stats').innerHTML = stats.map(([b, s]) => `<div class="stat"><b>${b}</b><span>${s}</span></div>`).join('');

// Mapa
const map = L.map('map', {preferCanvas:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(map);
const all = P.map(p => [p.lat, p.lon]);
const fit = () => { map.invalidateSize(); map.fitBounds(L.latLngBounds(all), {padding:[24,24]}); };
fit(); window.addEventListener('load', fit);

const stops = [[0,[49,130,189]],[0.5,[255,191,0]],[1,[220,40,30]]];
const colorAt = f => { f = Math.max(0, Math.min(1, f)); for (let i = 1; i < stops.length; i++) if (f <= stops[i][0]) {
  const [f0,c0] = stops[i-1], [f1,c1] = stops[i], k = (f-f0)/(f1-f0);
  return 'rgb(' + c0.map((c,j) => Math.round(c + (c1[j]-c)*k)).join(',') + ')'; } };
const q = (arr, p) => { const s = [...arr].sort((a,b) => a-b); return s[Math.floor(p*(s.length-1))]; };
const MODES = {
  pace: {val: p => p.vs, lo: q(P.map(p=>p.vs),.05), hi: q(P.map(p=>p.vs),.95), lab: v => fmtPace(v)},
  hr:   {val: p => p.hr, lo: q(P.map(p=>p.hr),.05), hi: q(P.map(p=>p.hr),.98), lab: v => Math.round(v) + ' ppm'},
  ele:  {val: p => p.ele, lo: Math.min(...P.map(p=>p.ele)), hi: Math.max(...P.map(p=>p.ele)), lab: v => Math.round(v) + ' m'},
};
const HIDE = 300;
let mode = 'pace', priv = false, trackLayer = L.layerGroup().addTo(map), markers = L.layerGroup().addTo(map);
const visible = i => !priv || (P[i].d > HIDE && P[i].d < S.dist - HIDE);

function draw() {
  trackLayer.clearLayers(); markers.clearLayers();
  const m = MODES[mode];
  if (mode === 'plain') {
    let run = [];
    P.forEach((p, i) => { if (visible(i)) run.push([p.lat, p.lon]); else if (run.length) { trackLayer.addLayer(L.polyline(run, {color:'#e8590c', weight:4})); run = []; } });
    if (run.length) trackLayer.addLayer(L.polyline(run, {color:'#e8590c', weight:4}));
  } else {
    for (let i = 1; i < P.length; i++) if (visible(i) && visible(i-1)) {
      const f = (m.val(P[i]) - m.lo) / (m.hi - m.lo);
      trackLayer.addLayer(L.polyline([[P[i-1].lat,P[i-1].lon],[P[i].lat,P[i].lon]], {color:colorAt(f), weight:4, opacity:.95}));
    }
  }
  // Inicio, fin y marcas de km
  const vis = P.map((_, i) => i).filter(visible);
  const a = P[vis[0]], b = P[vis[vis.length-1]];
  markers.addLayer(L.circleMarker([a.lat,a.lon], {radius:7, color:'#fff', weight:2, fillColor:'#2f9e44', fillOpacity:1}).bindTooltip(priv ? 'Primer punto visible' : 'Salida'));
  markers.addLayer(L.circleMarker([b.lat,b.lon], {radius:7, color:'#fff', weight:2, fillColor:'#1d1d1b', fillOpacity:1}).bindTooltip(priv ? 'Último punto visible' : 'Llegada'));
  for (let km = 1; km * 1000 < S.dist; km++) {
    const i = P.findIndex(p => p.d >= km*1000);
    if (i >= 0 && visible(i)) markers.addLayer(L.marker([P[i].lat,P[i].lon], {icon:L.divIcon({className:'', html:`<div style="background:#fff;color:#1d1d1b;border:2px solid #1d1d1b;border-radius:10px;font:600 11px system-ui;padding:0 5px;line-height:16px;white-space:nowrap;transform:translate(-50%,-50%)">${km} km</div>`})}));
  }
  const lg = document.getElementById('legend');
  lg.style.visibility = mode === 'plain' ? 'hidden' : 'visible';
  if (mode !== 'plain') {
    document.getElementById('lmin').textContent = mode === 'pace' ? 'lento' : m.lab(m.lo);
    document.getElementById('lmax').textContent = mode === 'pace' ? 'rápido' : m.lab(m.hi);
    document.getElementById('lbar').style.background = 'linear-gradient(90deg,' + [0,.25,.5,.75,1].map(colorAt).join(',') + ')';
  }
  drawChart();
}

// Perfil de altitud + serie del modo actual
const svg = document.getElementById('chart'), W = 1000, H = 170, PAD = 6;
const X = d => d / S.dist * W;
function drawChart() {
  const eMin = Math.min(...P.map(p=>p.ele)) - 3, eMax = Math.max(...P.map(p=>p.ele)) + 3;
  const Ye = e => H - PAD - (e - eMin) / (eMax - eMin) * (H*0.55);
  let area = `M0,${H} ` + P.map(p => `L${X(p.d).toFixed(1)},${Ye(p.ele).toFixed(1)}`).join(' ') + ` L${W},${H} Z`;
  let html = '';
  for (let km = 1; km*1000 < S.dist; km++) html += `<line x1="${X(km*1000)}" x2="${X(km*1000)}" y1="0" y2="${H}" stroke="var(--grid)" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  html += `<path d="${area}" fill="var(--area)"/>`;
  const m = MODES[mode === 'plain' || mode === 'ele' ? 'pace' : mode];
  const Ys = v => PAD + (1 - (v - m.lo) / (m.hi - m.lo)) * (H*0.7);
  html += `<path d="M` + P.map(p => `${X(p.d).toFixed(1)},${Math.max(0, Math.min(H, Ys(m.val(p)))).toFixed(1)}`).join(' L') + `" fill="none" stroke="var(--accent)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`;
  if (priv) html += `<rect x="0" y="0" width="${X(HIDE)}" height="${H}" fill="var(--bg)" opacity=".7"/><rect x="${X(S.dist-HIDE)}" y="0" width="${W - X(S.dist-HIDE)}" height="${H}" fill="var(--bg)" opacity=".7"/>`;
  html += `<line id="cur" x1="-10" x2="-10" y1="0" y2="${H}" stroke="var(--fg)" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  svg.innerHTML = html;
}

const cursor = L.circleMarker([0,0], {radius:6, color:'#fff', weight:2, fillColor:'#1d1d1b', fillOpacity:1});
function show(i) {
  const p = P[i];
  document.getElementById('cur').setAttribute('x1', X(p.d)); document.getElementById('cur').setAttribute('x2', X(p.d));
  if (visible(i)) { cursor.setLatLng([p.lat, p.lon]).addTo(map); } else cursor.remove();
  document.getElementById('readout').textContent = `${(p.d/1000).toFixed(2)} km · ${fmtT(p.t)} · ritmo ${fmtPace(p.vs)} · FC ${p.hr} ppm · cadencia ${p.cad} ppm · altitud ${p.ele.toFixed(0)} m`;
}
const nearestByD = d => { let lo = 0, hi = P.length-1; while (lo < hi) { const mid = (lo+hi) >> 1; if (P[mid].d < d) lo = mid+1; else hi = mid; } return lo; };
svg.addEventListener('mousemove', e => { const r = svg.getBoundingClientRect(); show(nearestByD((e.clientX - r.left) / r.width * S.dist)); });
svg.addEventListener('touchmove', e => { const r = svg.getBoundingClientRect(); show(nearestByD((e.touches[0].clientX - r.left) / r.width * S.dist)); }, {passive:true});
map.on('mousemove', e => {
  let best = -1, bd = Infinity; const pt = map.latLngToContainerPoint(e.latlng);
  P.forEach((p, i) => { if (!visible(i)) return; const c = map.latLngToContainerPoint([p.lat,p.lon]); const dd = (c.x-pt.x)**2 + (c.y-pt.y)**2; if (dd < bd) { bd = dd; best = i; } });
  if (best >= 0 && bd < 400) show(best);
});

// Vueltas
let acc = 0;
document.getElementById('laps').innerHTML = D.laps.map((l, i) => { const from = acc; acc += l.d;
  return `<tr data-a="${from}" data-b="${acc}"><td>${i+1}</td><td>${(l.d/1000).toFixed(2).replace('.',',')} km</td><td>${fmtT(l.t)}</td><td>${fmtPace(l.d/l.t)}</td><td>+${l.asc} / −${l.desc} m</td><td>${l.hr} ppm</td></tr>`; }).join('');
let lapHi = null;
document.getElementById('laps').addEventListener('click', e => {
  const tr = e.target.closest('tr'); if (!tr) return;
  const a = +tr.dataset.a, b = +tr.dataset.b;
  const seg = P.filter((p, i) => p.d >= a && p.d <= b && visible(i)).map(p => [p.lat,p.lon]);
  if (lapHi) lapHi.remove();
  if (!seg.length) return;
  lapHi = L.polyline(seg, {color:'#1d1d1b', weight:9, opacity:.35}).addTo(map);
  map.fitBounds(lapHi.getBounds(), {padding:[40,40]});
  document.getElementById('map').scrollIntoView({behavior:'smooth', block:'center'});
});

document.getElementById('mode').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#mode button').forEach(x => x.classList.toggle('on', x === b)); mode = b.dataset.m; draw(); });
document.getElementById('priv').addEventListener('change', e => { priv = e.target.checked; if (lapHi) { lapHi.remove(); lapHi = null; } draw(); });
draw();
</script>
